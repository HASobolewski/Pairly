<header class="bg-linear-to-r fixed from-primary p-3 to-black top-0 w-full z-50">
    <div class="align-middle flex gap-6 items-center mx-auto px-10">
        <a class="border-r-2 border-r-white flex gap-3 items-center max-h-16 pr-6 text-white">
            <svg class="size-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z" />
            </svg>
            <h3 class="font-semibold text-2xl text-white uppercase">Pairly</h3>
        </a>
        <nav class="flex gap-3 my-2 text-lg text-white uppercase">
            <a>Matches</a>
            <a>Lists</a>
            <a>Messages</a>
        </nav>
        <div class="align-middle flex gap-3 ml-auto">
            @if (accountService.currentUser(); as user) {
            <div class="dropdown dropdown-end">
                <div class="cursor-pointer flex gap-3 items-center text-white text-xl" role="button" tabindex="0">
                    <img alt="user avatar" class="h-8 rounded-full w-8" src="/user.png">
                    <span>{{ user.displayName }}</span>
                </div>
                <ul class="bg-base-100 dropdown-content menu p-2 rounded-box shadow-sm w-52 z-1" tabindex="-1">
                    <li><a>Edit profile</a></li>
                    <li><a (click)="logout()">Logout</a></li>
                </ul>
            </div>
            }
            @else {
            <form #loginForm="ngForm" (ngSubmit)="login()" class="flex gap-3 items-center">
                <input [(ngModel)]="credentials.email" class="input" name="email" placeholder="Email" type="text">
                <input [(ngModel)]="credentials.password" class="input" name="password" placeholder="Password"
                    type="password">
                <button class="btn" type="submit">Login</button>
            </form>
            }
        </div>
    </div>
</header>
